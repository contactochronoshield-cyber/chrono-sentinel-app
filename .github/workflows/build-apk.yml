name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK using Kivy's official buildozer Docker image
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd:z kivy/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chrono-sentinel-apk
          path: bin/*.apk
