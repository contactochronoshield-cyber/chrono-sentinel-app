name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev build-essential

      - name: Install buildozer and cython
        run: pip install --upgrade buildozer cython==0.29.36

      - name: Constrain pip version used inside the build venv
        run: echo "pip<24.1" > /tmp/pip-constraints.txt

      - name: Build APK
        env:
          PIP_CONSTRAINT: /tmp/pip-constraints.txt
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chrono-sentinel-apk
          path: bin/*.apk
